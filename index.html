<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Playlist Musique Septembre 2026</title>
</head>
<body>
  <main class="app" aria-live="polite">
    <section class="quiz-shell">
      <header class="quiz-header">
        <div>
          <p class="eyebrow">Quiz musical</p>
          <h1>Playlist Musique Septembre 2026</h1>
        </div>
        <div class="score-box">
          <span id="progress">1 / 10</span>
          <strong id="score">0 point</strong>
        </div>
      </header>

      <section class="player-panel">
        <p id="instruction">Écoutez l'extrait, puis choisissez le bon auteur et le bon titre.</p>
        <audio id="audioPlayer" controls preload="metadata">
          Votre navigateur ne supporte pas l'élément audio.
        </audio>
      </section>

      <form id="quizForm" class="choices" autocomplete="off">
        <fieldset>
          <legend>Quelle est cette musique ?</legend>
          <div id="answers" class="answers"></div>
        </fieldset>

        <div class="actions">
          <button type="submit" id="validate">Valider</button>
          <button type="button" id="next" class="secondary" hidden>Suivant</button>
          <button type="button" id="restart" class="secondary" hidden>Rejouer</button>
        </div>
      </form>

      <p id="feedback" class="feedback" role="status"></p>
      <div id="history" class="history" aria-label="Résultats des réponses"></div>
    </section>
  </main>

  <script>
    const auteur = [
		"ALLEGRI", 
		"FAURÉ", 
		"GRIEG", 
		"RACHMANINOV", 
		"JOHANN STRAUSS", 
		"WAGNER", 
		"BACH", 
		"BEETHOVEN", 
		"AMY WINEHOUSE", 
		"ALAIN SOUCHON", 
		"CHUCK BERRY",
		"THE STROKES",
		"COLDPLAY",
		"DJANGO REINHARDT",
		"Feu! Chatterton",
		"BB King"
	   ];
    const titre = [
      "Miserere",
	  "Requiem, Pie Jesu",
	  "Peer Gynt, Dans l’antre du Roi de la montagne",
	  "Symphonie n°1, Grave, Allegro ma non troppo",
	  "Marche Radetsky",
	  "La Walkyrie, La chevauchée des Walkyries",
	  "Toccata et fugue en ré mineur",
	  "Symphonie n°5, Allegro con brio",
	  "Rehab",
	  "J’ai dix ans",
	  "Maybellene",
	  "The end has no end",
	  "Yellow",
	  "Minor swing",
	  "Allons voir",
	  "The Thrill is gone"
    ];

    const songs = auteur.map((artist, index) => ({
      artist,
      title: titre[index],
      file: `${index + 1}.mp3`,
      answer: `${artist} - ${titre[index]}`
    }));

    const state = {
      order: [],
      currentIndex: 0,
      score: 0,
      answered: false,
      audioStartTime: 0
    };

    const audioPlayer = document.getElementById("audioPlayer");
    const progressDom = document.getElementById("progress");
    const scoreDom = document.getElementById("score");
    const answersDom = document.getElementById("answers");
    const quizForm = document.getElementById("quizForm");
    const validateButton = document.getElementById("validate");
    const nextButton = document.getElementById("next");
    const restartButton = document.getElementById("restart");
    const feedbackDom = document.getElementById("feedback");
    const historyDom = document.getElementById("history");

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getCurrentSong() {
      return songs[state.order[state.currentIndex]];
    }

    function getChoices(song) {
      const wrongAnswers = shuffle(songs.filter((candidate) => candidate !== song)).slice(0, 5);
      return shuffle([song, ...wrongAnswers]);
    }

    function updateHeader() {
      const played = Math.min(state.currentIndex + 1, songs.length);
      progressDom.innerText = `${played} / ${songs.length}`;
      scoreDom.innerText = `${state.score} ${state.score > 1 ? "points" : "point"}`;
    }

    function renderChoices(song) {
      answersDom.innerHTML = "";
      getChoices(song).forEach((choice, index) => {
        const choiceId = `choice-${index}`;
        const wrapper = document.createElement("label");
        wrapper.className = "choice";
        wrapper.setAttribute("for", choiceId);

        const input = document.createElement("input");
        input.type = "radio";
        input.id = choiceId;
        input.name = "answer";
        input.value = choice.answer;
        input.dataset.correct = String(choice === song);

        const text = document.createElement("span");
        text.innerText = choice.answer;

        wrapper.append(input, text);
        answersDom.appendChild(wrapper);
      });
    }

    function loadQuestion({ autoplay = false } = {}) {
      const song = getCurrentSong();
      state.answered = false;
      state.audioStartTime = 0;
      audioPlayer.src = song.file;
      audioPlayer.load();
      if (autoplay) {
        audioPlayer.play().catch(() => {
          // The controls remain available if the browser blocks autoplay.
        });
      }
      renderChoices(song);
      updateHeader();
      feedbackDom.innerText = "";
      validateButton.hidden = false;
      nextButton.hidden = true;
      restartButton.hidden = true;
    }

    function markAnswer(selectedInput) {
      const choices = [...answersDom.querySelectorAll(".choice")];
      choices.forEach((choice) => {
        const input = choice.querySelector("input");
        input.disabled = true;
        if (input.dataset.correct === "true") {
          choice.classList.add("is-correct");
        }
      });

      if (selectedInput.dataset.correct === "true") {
        state.score += 1;
        feedbackDom.innerText = "Bonne réponse !";
        addHistoryDot(true);
      } else {
        selectedInput.closest(".choice").classList.add("is-wrong");
        feedbackDom.innerText = `Raté : c'était ${getCurrentSong().answer}.`;
        addHistoryDot(false);
      }

      state.answered = true;
      updateHeader();
      validateButton.hidden = true;
      nextButton.hidden = state.currentIndex === songs.length - 1;
      restartButton.hidden = state.currentIndex !== songs.length - 1;

      if (state.currentIndex === songs.length - 1) {
        feedbackDom.innerText += ` Score final : ${state.score} / ${songs.length}.`;
      }
    }

    function addHistoryDot(isCorrect) {
      const dot = document.createElement("span");
      dot.className = `history-dot ${isCorrect ? "correct" : "wrong"}`;
      dot.title = isCorrect ? "Bonne réponse" : "Mauvaise réponse";
      historyDom.appendChild(dot);
    }

    function nextQuestion() {
      if (state.currentIndex < songs.length - 1) {
        state.currentIndex += 1;
        loadQuestion({ autoplay: true });
      }
    }

    function restartQuiz() {
      state.order = shuffle(songs.map((_, index) => index));
      state.currentIndex = 0;
      state.score = 0;
      historyDom.innerHTML = "";
      loadQuestion();
    }

    quizForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (state.answered) return;

      const selectedInput = quizForm.querySelector("input[name='answer']:checked");
      if (!selectedInput) {
        feedbackDom.innerText = "Choisissez une réponse avant de valider.";
        return;
      }

      markAnswer(selectedInput);
    });

    nextButton.addEventListener("click", nextQuestion);
    restartButton.addEventListener("click", restartQuiz);

    audioPlayer.addEventListener("loadedmetadata", () => {
      if (!Number.isFinite(audioPlayer.duration)) return;

      state.audioStartTime = Math.random() * (audioPlayer.duration / 2);
      audioPlayer.currentTime = state.audioStartTime;
    });

    audioPlayer.addEventListener("ended", () => {
      audioPlayer.currentTime = state.audioStartTime;
    });

    restartQuiz();
  </script>
</body>
</html>
